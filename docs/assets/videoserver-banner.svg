      <rect width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/><text x="46" y="22" text-anchor="middle" fill="#FFFFFF">PYTHON</text>
      <rect x="104" width="132" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/><text x="170" y="22" text-anchor="middle" fill="#FFFFFF">LOCAL-FIRST</text>
      <rect x="248" width="142" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/><text x="319" y="22" text-anchor="middle" fill="#FFFFFF">HTTP STREAMING</text>
      <rect x="402" width="164" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1"/><text x="484" y="22" text-anchor="middle" fill="#FFFFFF">ZERO DEPENDENCIES</text>
