<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">VideoServer</title>
  <desc id="desc">Professional banner for the local-first Python video streaming server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130F"/>
      <stop offset="0.55" stop-color="#12382D"/>
      <stop offset="1" stop-color="#087D70"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66F0C9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#66F0C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="42" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="26" fill="url(#lines)"/>
  <circle cx="1090" cy="160" r="190" fill="url(#glow)"/>
  <g transform="translate(1028 76)">
    <rect width="205" height="150" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#C7FFF0" stroke-opacity="0.32" stroke-width="3"/>
    <path d="M82 45l65 31-65 31z" fill="#C7FFF0" fill-opacity="0.82"/>
    <path d="M35 130h135" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round"/>
    <circle cx="68" cy="130" r="8" fill="#66F0C9"/>
  </g>
  <g transform="translate(78 62)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="138" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="69" y="23" text-anchor="middle" fill="#D5FFF4" font-size="14" font-weight="700" letter-spacing="2">SHYAMRAJ LABS</text>
    <text x="0" y="105" fill="#FFFFFF" font-size="66" font-weight="800" letter-spacing="2">VIDEOSERVER</text>
    <text x="2" y="143" fill="#D9FFF6" font-size="22" font-weight="500">Private local media streaming with a lightweight, dependency-free Python core</text>
