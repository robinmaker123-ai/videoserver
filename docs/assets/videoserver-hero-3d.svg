<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">VideoServer 3D local media showcase</title>
  <desc id="desc">A neon emerald glassmorphism banner for the local-first Python VideoServer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020A0A"/>
      <stop offset="0.46" stop-color="#082E2A"/>
      <stop offset="0.76" stop-color="#0B5B50"/>
      <stop offset="1" stop-color="#0B8A80"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79FFD7"/>
      <stop offset="0.52" stop-color="#28D6B7"/>
      <stop offset="1" stop-color="#69B8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6DFFD7" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#6DFFD7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000706" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1440" height="480" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="34" fill="url(#grid)"/>
  <circle cx="1110" cy="215" r="270" fill="url(#halo)" opacity="0.52"/>
  <circle cx="150" cy="410" r="210" fill="#4FCBFF" opacity="0.08"/>
  <path d="M0 410C210 345 420 450 658 390S1110 305 1440 360V480H0Z" fill="#010808" fill-opacity="0.34"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(78 64)">
      <rect width="190" height="38" rx="19" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <circle cx="22" cy="19" r="6" fill="#72FFD8" filter="url(#glow)"/>
      <text x="106" y="25" text-anchor="middle" fill="#EAFFF9" font-size="14" font-weight="800" letter-spacing="2.2">SHYAMRAJ LABS</text>
      <text x="0" y="122" fill="#FFFFFF" font-size="72" font-weight="900" letter-spacing="2">VIDEOSERVER</text>
      <rect y="141" width="535" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="2" y="184" fill="#E3FFF7" font-size="24" font-weight="650">Private, local-first media streaming</text>
      <text x="2" y="217" fill="#B9D7D0" font-size="18">Zero Dependencies · Folder Switching · Search · Browser Playback</text>

      <g transform="translate(0 258)">
        <g><rect width="144" height="48" rx="16" fill="url(#glass)" stroke="#79FFD7" stroke-opacity="0.55"/><text x="72" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">PYTHON CORE</text></g>
        <g transform="translate(158)"><rect width="178" height="48" rx="16" fill="url(#glass)" stroke="#38DDBF" stroke-opacity="0.55"/><text x="89" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">HTTP STREAMING</text></g>
        <g transform="translate(350)"><rect width="175" height="48" rx="16" fill="url(#glass)" stroke="#75BEFF" stroke-opacity="0.55"/><text x="87.5" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">LOCAL PRIVACY</text></g>
      </g>
      <text x="2" y="355" fill="#A7CCC3" font-size="14" font-weight="700" letter-spacing="1.5">STANDARD LIBRARY · MEDIA SEARCH · PRIVATE STORAGE · LIGHTWEIGHT UX</text>
    </g>

    <g transform="translate(802 58)" filter="url(#shadow)">
      <ellipse cx="294" cy="376" rx="270" ry="40" fill="#010706" fill-opacity="0.55"/>
      <g transform="translate(36 42) rotate(-4 245 150)">
        <rect width="500" height="300" rx="30" fill="#061713" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
        <rect x="14" y="14" width="472" height="272" rx="23" fill="url(#glass)" stroke="#7DFFDB" stroke-opacity="0.34"/>
        <rect x="31" y="34" width="438" height="190" rx="18" fill="#03100E"/>
        <circle cx="250" cy="128" r="58" fill="url(#accent)" opacity="0.9"/>
        <path d="M232 96l57 32-57 32z" fill="#FFFFFF"/>
        <rect x="46" y="244" width="405" height="8" rx="4" fill="#FFFFFF" opacity="0.15"/>
        <rect x="46" y="244" width="238" height="8" rx="4" fill="url(#accent)"/>
        <circle cx="284" cy="248" r="10" fill="#DFFFF7"/>
        <circle cx="63" cy="268" r="5" fill="#75FFD8"/>
        <circle cx="82" cy="268" r="5" fill="#72BFFF"/>
      </g>

      <g transform="translate(-8 0) rotate(-9 110 66)">
        <rect width="220" height="132" rx="24" fill="url(#glass)" stroke="#76FFD9" stroke-opacity="0.5"/>
        <rect x="23" y="24" width="92" height="9" rx="4.5" fill="#79FFD7"/>
        <rect x="23" y="47" width="165" height="7" rx="3.5" fill="#FFFFFF" opacity="0.23"/>
        <rect x="23" y="66" width="132" height="7" rx="3.5" fill="#FFFFFF" opacity="0.14"/>
        <rect x="23" y="94" width="110" height="22" rx="11" fill="#35D7B8" fill-opacity="0.19"/>
        <text x="78" y="109" text-anchor="middle" fill="#EEFFFA" font-size="11" font-weight="800">LIBRARY READY</text>
      </g>

      <g transform="translate(420 16) rotate(8 105 74)">
        <rect width="210" height="148" rx="24" fill="url(#glass)" stroke="#71BFFF" stroke-opacity="0.5"/>
        <circle cx="54" cy="58" r="25" fill="#67BFFF" fill-opacity="0.22" stroke="#9BD5FF"/>
        <path d="M43 58l8 8 15-20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="137" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">Local Only</text>
        <text x="137" y="78" text-anchor="middle" fill="#D4E9E5" font-size="12">Media stays private</text>
        <rect x="43" y="106" width="124" height="20" rx="10" fill="url(#accent)" opacity="0.63"/>
      </g>

      <g transform="translate(405 286) rotate(-5 110 65)">
        <rect width="220" height="130" rx="24" fill="url(#glass)" stroke="#69FFD7" stroke-opacity="0.48"/>
        <rect x="22" y="24" width="176" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.09"/>
        <circle cx="43" cy="40" r="7" fill="#75FFD8"/>
        <text x="113" y="45" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Search: 1080p x265</text>
        <rect x="24" y="79" width="48" height="28" rx="9" fill="#34D7B8" fill-opacity="0.23"/>
        <rect x="84" y="79" width="48" height="28" rx="9" fill="#34D7B8" fill-opacity="0.15"/>
        <rect x="144" y="79" width="48" height="28" rx="9" fill="#69B8FF" fill-opacity="0.18"/>
      </g>
    </g>
  </g>
</svg>
